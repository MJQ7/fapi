# Publishes a release when a version tag such as v1.2.3 is pushed, using the
# same GoReleaser configuration as a local build (.goreleaser.yaml).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # to create the GitHub release
  packages: write # to push the Docker image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # GoReleaser reads earlier tags for the changelog
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names must be lowercase, and owner/repo names may not be.
      - name: Choose the image name
        run: echo "FAPI_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
